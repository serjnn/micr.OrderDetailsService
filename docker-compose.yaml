version: '3.8'

services:
  # PostgreSQL Database Service
  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-micr-synch}
      POSTGRES_USER: ${POSTGRES_USER:-qwe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qwe}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: {}
